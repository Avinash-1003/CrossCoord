project:
  name: CrossCoord
  version: '1.0'
  description: Transferable, Self-Healing Coordination Framework for Heterogeneous
    Multi-Agent Systems
environments:
  logistics:
    map_file: datasets/logistics/Berlin_1_256.map
    obstacle_density: 0.15
    description: Dense urban warehouse environment
  search_and_rescue:
    map_file: datasets/search_and_rescue/Boston_0_256.map
    obstacle_density: 0.25
    description: City block layout for SAR operations
  disaster_relief:
    map_file: datasets/disaster_relief/random-32-32-20.map
    obstacle_density: 0.2
    description: Unseen fourth domain with random rubble
    hazards:
    - flooding
    - structural_collapse
agents:
  tier3:
    A_003:
      type: UAV_Quad
      failure_prob: 0.15
    A_004:
      type: UAV_Heavy
      failure_prob: 0.12
    A_005:
      type: UGV_Scout
      failure_prob: 0.1
    A_006:
      type: UGV_Carrier
      failure_prob: 0.08
simulation:
  max_steps: 500
  failure_rate_base: 0.02
  failure_rate_high: 0.05
  random_seed: 42
q_learning:
  learning_rate: 0.1
  discount_factor: 0.95
  epsilon_start: 1.0
  epsilon_decay: 0.9995
  epsilon_min: 0.05
  episodes: 3000
  max_steps_per_episode: 500
output:
  results_dir: results
  models_dir: models
  figures_dir: results/figures
